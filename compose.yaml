services:
  bot:
    build: .
    env_file: .env
    environment:
      DB_PATH: /data/bot.sqlite3
    volumes:
      - bot-data:/data
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  bot-data:
